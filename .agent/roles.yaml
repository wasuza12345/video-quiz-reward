# A role is an address: agents send_message(to: <role>). One running session per role.
roles:
  planner:        # แตกโจทย์เป็นงาน วางโครงสร้าง กำหนด API/ข้อมูล
    agent: claude
    prompt: planner.md
  designer:       # UX/UI — หน้าดูวิดีโอ Quiz และคะแนน (mobile)
    agent: claude
    prompt: designer.md
  coder:          # Next.js, Backend, SQLite, CI/CD
    agent: claude
    prompt: coder.md
  tester:         # Quiz, ดูจนจบ, กันกรอข้าม, คะแนน, รีเฟรช
    # All roles run on claude (human request 2026-09-24).
    agent: claude
    prompt: tester.md
  reviewer:       # โค้ด ความปลอดภัย ความตรงตามโจทย์
    agent: claude
    prompt: reviewer.md
  clean-code:
    agent: claude
    prompt: clean-code.md
    rules:
      - rules/clean-code.md
      # A repo's own rules are read from where they live, never copied:
      # - ../CLEAN-CODE.md
